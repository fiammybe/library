name: Build & Publish ImpressCMS Module

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, json
          coverage: none

      - name: Determine module name from repository
        id: module
        run: echo "MODULE_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV

      - name: Extract version from release tag
        id: version
        run: |
          # Release tag is something like "v1.2.3"
          TAG="${{ github.event.release.tag_name }}"
          
          # Strip leading "v" if present
          VERSION="${TAG#v}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Composer dependencies (no dev)
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Prepare build directory
        run: |
          rm -rf build
          mkdir -p build/$MODULE_NAME

          # Kopieer de inhoud van src/ naar module-root
          cp -R src/* build/$MODULE_NAME/

          # Kopieer vendor/ naar module-root
          cp -R vendor build/$MODULE_NAME/vendor

          # Voeg een VERSION file toe (optioneel maar handig)
          echo "${VERSION}" > build/$MODULE_NAME/VERSION

      - name: Create ZIP package
        run: |
          cd build
          zip -r "${MODULE_NAME}-${VERSION}.zip" "${MODULE_NAME}"

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
